name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android SDK Platform 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Pure Native Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FaceMorph-Studio-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceMorph-Studio-debug-apk
          path: FaceMorph-Studio-debug.apk
          retention-days: 7

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" FaceMorph-Studio-debug.apk --clobber
          else
            gh release create "$TAG" FaceMorph-Studio-debug.apk \
              --title "FaceMorph Studio Native Android APK (Latest)" \
              --notes "Pure native Kotlin & Jetpack Compose Android APK (Android 7.0+ / API 24+). Download FaceMorph-Studio-debug.apk directly on your phone to install."
          fi

      - name: Delete old workflow runs and artifacts
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          for artifact_id in $(gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select((.workflow_run.id // 0) != ${CURRENT_RUN_ID}) | .id"); do
            echo "Deleting old artifact $artifact_id"
            gh api -X DELETE "repos/${REPO}/actions/artifacts/${artifact_id}" >/dev/null || true
          done

          for run_id in $(gh api --paginate "repos/${REPO}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${CURRENT_RUN_ID} and .status == \"completed\") | .id"); do
            echo "Deleting old workflow run $run_id"
            gh api -X DELETE "repos/${REPO}/actions/runs/${run_id}" >/dev/null || true
          done
